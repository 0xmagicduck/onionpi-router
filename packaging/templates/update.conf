# OnionPi update client. Installed by install.sh, owned by root, read by
# /usr/local/sbin/onionpi-update. The web interface cannot write this file: it
# proposes a channel, an hour and an on/off switch in
# /var/lib/onionpi/update.settings.json, and each of those values is validated
# again before use.
#
# After editing by hand, apply the schedule with:
#   sudo onionpi-update --write-timer

# GitHub repository publishing the releases.
ONIONPI_UPDATE_REPOSITORY=__UPDATE_REPOSITORY__

# stable = latest published release, edge = rolling build of the main branch.
ONIONPI_UPDATE_CHANNEL=__UPDATE_CHANNEL__

# Hours of the day, 24h clock, comma separated (up to six).
# Example: 04:30 or 03:00,15:00
ONIONPI_UPDATE_SCHEDULE=__UPDATE_SCHEDULE__

# Raw systemd calendar expression. When set it wins over the hours above:
# ONIONPI_UPDATE_CALENDAR="Mon,Thu *-*-* 04:30:00"
ONIONPI_UPDATE_CALENDAR=

# Spread the load of everyone running the same schedule, and keep the exact
# minute of the request from becoming a fingerprint.
ONIONPI_UPDATE_RANDOM_DELAY=45m

# 0 disables the timer entirely.
ONIONPI_UPDATE_ENABLED=__UPDATE_ENABLED__

# 1 installs what it finds, 0 only records that a version is available and
# leaves the decision to the Paramètres page.
ONIONPI_UPDATE_APPLY=__UPDATE_APPLY__

# Fetch through the Tor SOCKS port. Turning this off tells the local network
# and the upstream provider that this address runs an OnionPi.
ONIONPI_UPDATE_OVER_TOR=1
ONIONPI_UPDATE_SOCKS=127.0.0.1:9050

# Refuse an update whose SHA256SUMS carries no valid OpenPGP signature.
#
# install.sh puts the public half of the release key in the keyring below, from
# the copy shipped in packaging/keys/onionpi-release.asc. An update therefore
# has to be signed by a key that was already on this appliance before that
# update existed: a compromised GitHub account is no longer enough.
#
# Set to 0 only if you build your own unsigned archives.
ONIONPI_UPDATE_REQUIRE_SIGNATURE=1
ONIONPI_UPDATE_GPG_KEYRING=/etc/onionpi/update-signing-key.gpg

# Previous versions kept under /var/backups for a manual `onionpi-update --rollback`.
ONIONPI_UPDATE_KEEP_BACKUPS=3

# 0 makes this file the only source of truth and freezes the web interface
# controls.
ONIONPI_UPDATE_ALLOW_OVERRIDES=1
