name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes the running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend
      - run: python -m pytest -q
        working-directory: backend

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  shell:
    name: Shell (shellcheck + syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          printf 'Analyse de %d scripts\n' "${#scripts[@]}"
          # No --shell override: each file declares its own interpreter.
          shellcheck --severity=warning "${scripts[@]}"
      - name: Scripts are syntactically valid
        run: |
          status=0
          while IFS= read -r script; do
            bash -n "$script" || status=1
          done < <(git ls-files '*.sh')
          exit "$status"
      - name: systemd units are parseable
        run: |
          # A typo in a unit only shows up when the Pi refuses to boot the
          # service. Missing binaries are expected in a container, so this
          # reports rather than fails.
          for unit in packaging/systemd/*; do
            output="$(systemd-analyze verify --man=no "$PWD/$unit" 2>&1 || true)"
            filtered="$(grep -vE 'not found|is not absolute|Unit .* not found' <<<"$output" || true)"
            [[ -n "$filtered" ]] && echo "::warning file=$unit::$filtered"
          done
          exit 0

  consistency:
    name: Version and packaging consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: VERSION, package.json and __init__.py agree
        run: ./scripts/check-version.sh
      - name: Every packaged script is installed and removed
        run: |
          status=0
          for script in packaging/*.sh; do
            name="$(basename "$script")"
            case "$name" in install.sh|uninstall.sh|verify.sh) continue ;; esac
            grep -q "$name" packaging/install.sh || {
              echo "::error file=packaging/install.sh::$name n'est jamais installé"
              status=1
            }
          done
          for unit in packaging/systemd/*; do
            name="$(basename "$unit")"
            grep -q "$name" packaging/install.sh || {
              echo "::error file=packaging/install.sh::$name n'est jamais installé"
              status=1
            }
            grep -q "$name" packaging/uninstall.sh || {
              echo "::error file=packaging/uninstall.sh::$name n'est jamais supprimé"
              status=1
            }
          done
          exit "$status"

  secrets:
    name: No credentials in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Obvious secrets
        run: ./scripts/check-secrets.sh
