name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default, and every job that needs more says so itself. A
# workflow file is code an appliance ends up trusting: it builds what a Pi
# installs unattended.
permissions:
  contents: read

# A newer push makes the running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit, not a tag: a tag moves, and whoever moves it
# runs code in this repository's CI. Dependabot reads the trailing comment and
# proposes the bumps.
jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend
      - run: python -m pytest -q
        working-directory: backend

  frontend:
    name: Frontend (typecheck + build)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  shell:
    name: Shell (shellcheck + syntax)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          printf 'Analyse de %d scripts\n' "${#scripts[@]}"
          # No --shell override: each file declares its own interpreter.
          shellcheck --severity=warning "${scripts[@]}"
      - name: Scripts are syntactically valid
        run: |
          status=0
          while IFS= read -r script; do
            bash -n "$script" || status=1
          done < <(git ls-files '*.sh')
          exit "$status"
      - name: The unattended upgrade reaches no prompt
        run: |
          packaging/tests/upgrade-noninteractive.sh
          packaging/tests/update-interruption-matrix.sh
      - name: The firewall template loads and counts per device
        run: |
          # The counter sets are part of the same ruleset as the kill switch:
          # a syntax error here would fail the whole load on an appliance.
          sudo apt-get install -y --no-install-recommends nftables iproute2 iputils-ping
          sudo packaging/tests/traffic-accounting-netns.sh

      - name: systemd units are parseable
        run: |
          # A typo in a unit only shows up when the Pi refuses to boot the
          # service. Missing binaries are expected in a container, so this
          # reports rather than fails.
          for unit in packaging/systemd/*; do
            output="$(systemd-analyze verify --man=no "$PWD/$unit" 2>&1 || true)"
            filtered="$(grep -vE 'not found|is not absolute|Unit .* not found' <<<"$output" || true)"
            [[ -n "$filtered" ]] && echo "::warning file=$unit::$filtered"
          done
          exit 0

  consistency:
    name: Version and packaging consistency
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: VERSION, package.json and __init__.py agree
        run: ./scripts/check-version.sh
      - name: Workflows parse
        run: |
          python3 -c "
          import glob, sys, yaml
          status = 0
          for path in sorted(glob.glob('.github/**/*.yml', recursive=True)):
              try:
                  yaml.safe_load(open(path, encoding='utf-8'))
              except yaml.YAMLError as error:
                  print(f'::error file={path}::{error}')
                  status = 1
          sys.exit(status)
          "
      - name: Every packaged script is installed and removed
        run: |
          status=0
          for script in packaging/*.sh; do
            name="$(basename "$script")"
            case "$name" in install.sh|uninstall.sh|verify.sh) continue ;; esac
            grep -q "$name" packaging/install.sh || {
              echo "::error file=packaging/install.sh::$name n'est jamais installé"
              status=1
            }
          done
          for unit in packaging/systemd/*; do
            name="$(basename "$unit")"
            grep -q "$name" packaging/install.sh || {
              echo "::error file=packaging/install.sh::$name n'est jamais installé"
              status=1
            }
            grep -q "$name" packaging/uninstall.sh || {
              echo "::error file=packaging/uninstall.sh::$name n'est jamais supprimé"
              status=1
            }
          done
          exit "$status"

  workflows:
    name: Workflow security (actionlint + zizmor)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: actionlint
        env:
          # Version and digest together: the upstream one-line installer pulls
          # a script from a moving branch, which is the habit this repository
          # spent an afternoon removing from its own node bootstrap.
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          # Shell inside `run:` is a language CI never type-checks otherwise.
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          printf '%s  %s' "$ACTIONLINT_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" actionlint
          ./actionlint -color
      - name: zizmor
        env:
          ZIZMOR_VERSION: 1.29.0
        run: |
          # Audits the workflows themselves: template injection into `run:`,
          # unpinned actions, credentials left in the checkout, over-broad
          # permissions. The release workflow holds the signing key, so an
          # injection there is the whole update chain.
          pip install "zizmor==${ZIZMOR_VERSION}"
          zizmor --config .github/zizmor.yml --persona=regular .github/workflows

  secrets:
    name: No credentials in the tree
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Obvious secrets
        run: ./scripts/check-secrets.sh
