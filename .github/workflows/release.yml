name: Release

# What makes the automatic update work end to end:
#
#   push on main  -> tests, then a rolling "edge" pre-release
#   push of a tag -> tests, then a stable release
#
# A Raspberry Pi asks GitHub for one of those two at the hours configured in
# /etc/onionpi/update.conf, and installs it only after checking SHA256SUMS.
# Nothing is ever pushed to a Pi: no port is opened on the appliance.
#
# Actions are pinned to a commit, not a tag. This workflow reaches a job that
# holds the release signing key, and a moved tag there is a signed appliance
# update nobody wrote.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, Linux, X64]
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache here, unlike CI. The cache is shared with the
      # pull-request runs of the CI workflow, and a pull request can write to
      # it: a poisoned entry would be baked into an archive this workflow then
      # signs, and a Pi installs unattended. A cold install costs a minute.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: ''

      # A release nobody tested is a release that bricks an appliance at 04:30.
      - name: Backend tests
        run: |
          pip install -r backend/requirements-dev.txt
          ruff check backend
          cd backend && python -m pytest -q

      - name: Versioned OpenAPI contract
        run: |
          scripts/generate-api-types.py
          git diff --exit-code -- docs/openapi-v1.json frontend/src/generated/api-v1.ts

      - name: Appliance interruption matrix
        run: |
          scripts/check-resource-budget.sh
          packaging/tests/release-runtime.sh
          packaging/tests/upgrade-noninteractive.sh
          packaging/tests/update-interruption-matrix.sh

      - name: Fail-closed network VM
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nftables iproute2 iputils-ping
          sudo packaging/tests/fail-closed-vm.sh
          sudo packaging/tests/traffic-accounting-netns.sh

      # Self-hosted runners reuse this checkout across jobs, unlike a
      # GitHub-hosted VM that is thrown away afterwards. The sudo tests above
      # can leave root-owned files (e.g. Python bytecode cache written while
      # exercising accounting.py under a root network namespace), which then
      # breaks `actions/checkout`'s clean step for whatever job lands on this
      # runner next.
      - name: Give the workspace back to the runner user
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .

      - name: Build the interface
        run: |
          npm ci --no-audit --no-fund
          npm run build
        working-directory: frontend

      - name: Decide the version and the channel
        id: version
        env:
          REF: ${{ github.ref }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          base="$(head -n 1 VERSION | tr -d '[:space:]')"
          # VERSION is a tracked file, so its content is whatever the last
          # merge said. It becomes a shell word in the signing job below, and
          # that job holds the private key: refuse anything that is not three
          # numbers before it can become anything else.
          [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::VERSION ne contient pas un numéro X.Y.Z: $base"
            exit 1
          }
          if [[ "$REF" == refs/tags/v* ]]; then
            tag="${REF#refs/tags/v}"
            if [[ "$tag" != "$base" ]]; then
              echo "::error::L'étiquette v$tag ne correspond pas au fichier VERSION ($base)."
              exit 1
            fi
            echo "version=$base" >>"$GITHUB_OUTPUT"
            echo "channel=stable" >>"$GITHUB_OUTPUT"
          else
            # A pre-release of the version being prepared, so an edge build is
            # always newer than the last edge build and older than the release
            # it leads to.
            echo "version=$base-edge.$RUN_NUMBER" >>"$GITHUB_OUTPUT"
            echo "channel=edge" >>"$GITHUB_OUTPUT"
          fi

      - name: Assemble the archive
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build-release.sh "$VERSION"

      - name: Upload the unsigned, tested publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: onionpi-unsigned-${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 3

  # Configure this GitHub environment with required reviewers, protected
  # deployment branches and the GPG secret. The tested build job never receives
  # the private key; a workflow change cannot sign until a reviewer approves
  # this isolated publication job.
  publish:
    needs: build
    runs-on: [self-hosted, Linux, X64]
    environment: stable-release-signing
    permissions:
      contents: write
    steps:
      - name: Download the tested publication
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: onionpi-unsigned-${{ needs.build.outputs.version }}
          path: dist

      # The private key is mandatory because every default appliance requires
      # a signed SHA256SUMS document. The passphrase remains optional.
      - name: Sign SHA256SUMS
        env:
          # Limit private-key exposure to the one step that needs it.
          SIGNING_KEY: ${{ secrets.ONIONPI_GPG_PRIVATE_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.ONIONPI_GPG_PASSPHRASE }}
        run: |
          if [[ -z "$SIGNING_KEY" ]]; then
            echo "::error::ONIONPI_GPG_PRIVATE_KEY est absent; le client exige une signature et refuserait cette publication."
            exit 1
          fi
          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback \
            ${SIGNING_PASSPHRASE:+--passphrase "$SIGNING_PASSPHRASE"} \
            --detach-sign --armor --output dist/SHA256SUMS.asc dist/SHA256SUMS

      - name: Publish the stable release
        if: needs.build.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --title "OnionPi $VERSION" \
            --generate-notes

      - name: Refresh the edge pre-release
        if: needs.build.outputs.channel == 'edge'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # "edge" is a moving pointer: the previous build is replaced so a Pi
          # on that channel always sees exactly one candidate.
          gh release delete edge --yes 2>/dev/null || true
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/tags/edge" 2>/dev/null || true
          cat >/tmp/edge-notes.md <<EOF
          Construction automatique de ${GITHUB_SHA:0:7} sur \`main\`.

          Canal \`edge\`: une Raspberry Pi configurée sur ce canal installera
          cette version à sa prochaine vérification. Utilisez \`stable\` pour ne
          recevoir que les versions étiquetées.
          EOF
          sed -i 's/^          //' /tmp/edge-notes.md
          gh release create edge dist/* \
            --title "OnionPi edge ($VERSION)" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --notes-file /tmp/edge-notes.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: onionpi-${{ needs.build.outputs.version }}
          path: dist/
          retention-days: 14
